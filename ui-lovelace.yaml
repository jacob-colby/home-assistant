# ============================================================
#  Daily Driver Dashboard  —  ui-lovelace.yaml
#  Mobile-first · Apple-esque · Single-view daily driver
#
#  Persons:  Jacob Colby (person.jacob) · Claire Hill (person.claire)
#  Design:   390px centred column, frosted-glass pop-ups,
#            thin weights, pill shapes, card_mod CSS polish
#
#  HACS required (Frontend):
#    mushroom · bubble-card · button-card
#    lovelace-card-mod · stack-in-card · lovelace-layout-card
# ============================================================

title: Home
views:
  - title: Home
    path: home
    panel: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:layout-card
            layout_type: custom:vertical-layout
            layout:
              width: 390
              margin: auto
              padding: 12px
            cards:

              # ══════════════════════════════════════════════
              #  1 · HEADER — Clock · Date · Outdoor Temp
              # ══════════════════════════════════════════════
              - type: custom:layout-card
                layout_type: grid
                layout:
                  grid-template-columns: auto auto 1fr
                  grid-template-rows: auto
                  margin: 0
                cards:
                  - type: custom:mushroom-template-card
                    primary: '{{ now().strftime("%-I:%M") }}'
                    layout: horizontal
                    card_mod:
                      style: |
                        ha-card {
                          font-family: var(--primary-font-family) !important;
                          --card-primary-font-size: 3.2rem;
                          --card-primary-font-weight: 400;
                          --card-primary-line-height: 3rem;
                          --container-padding: 0 !important;
                          background: none;
                          box-shadow: none;
                          --ha-card-border-width: 0;
                          text-align: left;
                          height: 70px !important;
                          --spacing: 0px !important;
                        }

                  - type: custom:mushroom-template-card
                    primary: >-
                      {% set days = ["Monday","Tuesday","Wednesday","Thursday",
                      "Friday","Saturday","Sunday"] %}
                      {{ days[now().weekday()] }}
                    secondary: >-
                      {% set months = ["January","February","March","April","May",
                      "June","July","August","September","October","November","December"] %}
                      {{ months[now().month-1] }} {{ now().day }}
                    card_mod:
                      style: |
                        ha-card {
                          font-family: var(--primary-font-family) !important;
                          --card-primary-font-size: 1.2rem;
                          --card-primary-font-weight: 400;
                          --card-primary-line-height: 1.5rem;
                          --card-secondary-font-size: 1rem;
                          --card-secondary-font-weight: 300;
                          --card-secondary-line-height: 1.5rem;
                          background: none;
                          box-shadow: none;
                          --ha-card-border-width: 0;
                          text-align: left;
                          height: 70px !important;
                          --spacing: 0px !important;
                        }

                  - type: custom:button-card
                    entity: sensor.kdsm_temperature
                    show_name: true
                    show_icon: false
                    show_state: false
                    name: |
                      [[[
                        const temp = Math.round(parseFloat(states['sensor.kdsm_temperature'].state));
                        return `${temp}°F`;
                      ]]]
                    styles:
                      card:
                        - background: none
                        - box-shadow: none
                        - border-width: 0
                        - padding: 0
                        - height: 70px
                      grid:
                        - grid-template-areas: '"n"'
                        - align-items: center
                      name:
                        - font-size: 1.5rem
                        - font-family: var(--primary-font-family)
                        - font-weight: 300
                        - justify-self: end

              # ══════════════════════════════════════════════
              #  2 · LOCK  +  ROOM LIGHT CHIPS
              # ══════════════════════════════════════════════
              - type: custom:layout-card
                layout_type: grid
                layout:
                  grid-template-columns: 1fr auto
                  column_gap: 8px
                  margin: 0 !important
                cards:
                  - type: custom:mushroom-template-card
                    entity: lock.front_door
                    icon: >-
                      {% if is_state('lock.front_door_august', 'locked') %}
                        mdi:lock
                      {% else %}
                        mdi:lock-open-variant
                      {% endif %}
                    primary: Front Door
                    secondary: '{{ states("lock.front_door") | capitalize }}'
                    tap_action:
                      action: toggle
                    card_mod:
                      style: |
                        ha-card {
                          --ha-card-border-width: 0;
                          box-shadow: none;
                          border-radius: 100px;
                          text-align: left;
                          height: 72px !important;
                          margin: 0 !important;
                        }
                        mushroom-shape-icon {
                          {% if is_state('lock.front_door', 'locked') %}
                            --icon-color: var(--success-color) !important;
                            --shape-color: var(--success-background-color) !important;
                          {% else %}
                            --icon-color: var(--error-color) !important;
                            --shape-color: var(--error-background-color) !important;
                          {% endif %}
                        }
                        :host { margin: 0 !important; }

                  - type: custom:mushroom-chips-card
                    alignment: center
                    chips:
                      - type: template
                        entity: light.living_room_lights
                        icon: mdi:sofa
                        double_tap_action:
                          action: call-service
                          service: light.toggle
                          target:
                            entity_id: light.living_room_lights
                        tap_action:
                          action: navigate
                          navigation_path: '#living-room'
                        card_mod:
                          style: |
                            :host {
                              {% if is_state('light.living_room_lights', 'on') %}
                                --chip-background: var(--active-background-color) !important;
                                --color: var(--active-color) !important;
                              {% else %}
                                --color: var(--disabled-text-color) !important;
                              {% endif %}
                            }
                      - type: template
                        entity: light.bedroom_lights
                        icon: mdi:bed-king
                        double_tap_action:
                          action: call-service
                          service: light.toggle
                          target:
                            entity_id: light.bedroom_lights
                        tap_action:
                          action: navigate
                          navigation_path: '#bedroom'
                        card_mod:
                          style: |
                            :host {
                              {% if is_state('light.bedroom_lights', 'on') %}
                                --chip-background: var(--active-background-color) !important;
                                --color: var(--active-color) !important;
                              {% else %}
                                --color: var(--disabled-text-color) !important;
                              {% endif %}
                            }
                      - type: template
                        entity: light.office_lights
                        icon: mdi:desk
                        double_tap_action:
                          action: call-service
                          service: light.toggle
                          target:
                            entity_id: light.office_lights
                        tap_action:
                          action: navigate
                          navigation_path: '#office'
                        card_mod:
                          style: |
                            :host {
                              {% if is_state('light.office_lights', 'on') %}
                                --chip-background: var(--active-background-color) !important;
                                --color: var(--active-color) !important;
                              {% else %}
                                --color: var(--disabled-text-color) !important;
                              {% endif %}
                            }
                    card_mod:
                      style: |
                        ha-card {
                          --ha-card-border-width: 0;
                          --chip-border-width: 0;
                          --chip-icon-size: 32px;
                          --chip-box-shadow: none;
                          box-shadow: none;
                          border-radius: 100px !important;
                          height: 72px;
                          background-color: var(--ha-card-background) !important;
                          display: flex;
                          align-items: center;
                          justify-content: center;
                          padding: 0 16px !important;
                          margin: 0 !important;
                        }
                        :host { --masonry-view-card-margin: 0 4px; }

              # ══════════════════════════════════════════════
              #  3 · PEOPLE — Jacob & Claire
              # ══════════════════════════════════════════════
              - type: horizontal-stack
                cards:
                  # ── Jacob ──────────────────────────────
                  - type: custom:stack-in-card
                    mode: horizontal
                    cards:
                      - type: custom:mushroom-template-card
                        entity: person.jacob
                        layout: vertical
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              background: none;
                              border-radius: 40px;
                              border: none;
                              padding: 20px;
                              height: 200px !important;
                              position: relative;
                              white-space: nowrap;
                              overflow: visible;
                              box-shadow: none;
                            }
                            ha-card::before {
                              content: "";
                              position: absolute;
                              top: 20px;
                              left: 20px;
                              width: 50px;
                              height: 50px;
                              border-radius: 50%;
                              background-image: url('{{ state_attr("person.jacob", "entity_picture") }}');
                              background-size: cover;
                              background-position: center;
                              z-index: 1;
                            }
                            ha-card::after {
                              content: "Jacob Colby";
                              position: absolute;
                              top: 80px;
                              left: 20px;
                              color: var(--text-primary-color);
                              font-size: 18px;
                              font-weight: 400;
                              text-shadow: 0 1px 2px rgba(0,0,0,0.3);
                              z-index: 1;
                            }
                      - type: custom:mushroom-template-card
                        entity: person.jacob
                        primary: >
                          {% if is_state('person.jacob', 'home') %}
                            Home
                          {% elif is_state('person.jacob', "Dick's Sporting Goods") %}
                            Work
                          {% else %}
                            Away
                          {% endif %}
                        layout: vertical
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              --card-primary-font-weight: 100;
                              position: absolute;
                              top: 60px;
                              right: 16px;
                              background: none;
                              border-radius: 12px;
                              height: auto;
                              z-index: 2;
                              border: none;
                            }
                      - type: custom:mushroom-template-card
                        entity: sensor.jacob_phone_battery_level
                        primary: '{{ states("sensor.jacob_phone_battery_level") | int(0) }}%'
                        icon: >
                          {% set b = states('sensor.jacob_phone_battery_level') | int(0) %}
                          {% if b > 90 %}mdi:battery
                          {% elif b > 80 %}mdi:battery-90
                          {% elif b > 70 %}mdi:battery-80
                          {% elif b > 60 %}mdi:battery-70
                          {% elif b > 50 %}mdi:battery-60
                          {% elif b > 40 %}mdi:battery-50
                          {% elif b > 30 %}mdi:battery-40
                          {% elif b > 20 %}mdi:battery-30
                          {% elif b > 10 %}mdi:battery-20
                          {% else %}mdi:battery-10{% endif %}
                        icon_color: var(--primary-text-color)
                        layout: horizontal
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              position: absolute;
                              top: 60px;
                              left: 0px;
                              background: transparent;
                              border: none;
                              box-shadow: none;
                              z-index: 2;
                              --spacing: 0;
                            }
                            mushroom-shape-icon {
                              --shape-color: transparent !important;
                              --icon-size: 30px;
                            }
                            .primary {
                              color: var(--primary-text-color) !important;
                              font-size: 16px !important;
                              font-weight: 400 !important;
                            }
                    card_mod:
                      style: |
                        ha-card {
                          font-family: var(--primary-font-family) !important;
                          box-shadow: none;
                          border: none;
                          border-radius: 40px;
                          position: relative;
                        }
                        :host { width: 50% !important; }

                  # ── Claire ─────────────────────────────
                  - type: custom:stack-in-card
                    mode: horizontal
                    cards:
                      - type: custom:mushroom-template-card
                        entity: person.claire
                        layout: vertical
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              background: none;
                              border-radius: 40px;
                              border: none;
                              padding: 20px;
                              height: 200px !important;
                              position: relative;
                              white-space: nowrap;
                              overflow: visible;
                              box-shadow: none;
                            }
                            ha-card::before {
                              content: "";
                              position: absolute;
                              top: 20px;
                              left: 20px;
                              width: 50px;
                              height: 50px;
                              border-radius: 50%;
                              background-image: url('{{ state_attr("person.claire", "entity_picture") }}');
                              background-size: cover;
                              background-position: center;
                              z-index: 1;
                            }
                            ha-card::after {
                              content: "Claire Hill";
                              position: absolute;
                              top: 80px;
                              left: 20px;
                              color: var(--text-primary-color);
                              font-size: 18px;
                              font-weight: 400;
                              text-shadow: 0 1px 2px rgba(0,0,0,0.3);
                              z-index: 1;
                            }
                      - type: custom:mushroom-template-card
                        entity: person.claire
                        primary: >
                          {% if is_state('person.claire', 'home') %}
                            Home
                          {% elif is_state('person.claire', 'Clive Behavioral Health') %}
                            Work
                          {% else %}
                            Away
                          {% endif %}
                        layout: vertical
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              --card-primary-font-weight: 100;
                              position: absolute;
                              top: 60px;
                              right: 16px;
                              background: none;
                              border-radius: 12px;
                              height: auto;
                              z-index: 2;
                              border: none;
                            }
                      - type: custom:mushroom-template-card
                        entity: sensor.claire_phone_battery_level
                        primary: '{{ states("sensor.claire_phone_battery_level") | int(0) }}%'
                        icon: >
                          {% set b = states('sensor.claire_phone_battery_level') | int(0) %}
                          {% if b > 90 %}mdi:battery
                          {% elif b > 80 %}mdi:battery-90
                          {% elif b > 70 %}mdi:battery-80
                          {% elif b > 60 %}mdi:battery-70
                          {% elif b > 50 %}mdi:battery-60
                          {% elif b > 40 %}mdi:battery-50
                          {% elif b > 30 %}mdi:battery-40
                          {% elif b > 20 %}mdi:battery-30
                          {% elif b > 10 %}mdi:battery-20
                          {% else %}mdi:battery-10{% endif %}
                        icon_color: var(--primary-text-color)
                        layout: horizontal
                        card_mod:
                          style: |
                            ha-card {
                              font-family: var(--primary-font-family) !important;
                              position: absolute;
                              top: 60px;
                              left: 0;
                              background: transparent;
                              border: none;
                              box-shadow: none;
                              z-index: 2;
                              --spacing: 0;
                            }
                            mushroom-shape-icon {
                              --shape-color: transparent !important;
                              --icon-size: 30px;
                            }
                            .primary {
                              color: var(--primary-text-color) !important;
                              font-size: 16px !important;
                              font-weight: 400 !important;
                            }
                    card_mod:
                      style: |
                        ha-card {
                          font-family: var(--primary-font-family) !important;
                          box-shadow: none;
                          border: none;
                          border-radius: 40px;
                          position: relative;
                        }
                        :host { width: 50% !important; }

              # ══════════════════════════════════════════════
              #  4 · SCENES — 2×2 quick-action grid
              # ══════════════════════════════════════════════
              - type: custom:layout-card
                layout_type: grid
                layout:
                  grid-template-columns: 1fr 1fr
                  gap: 8px
                  margin: 4px 0
                cards:
                  - type: custom:button-card
                    name: Movie Night
                    icon: mdi:television-play
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      service_data:
                        entity_id: scene.movie_time
                    styles:
                      card:
                        - border-radius: 28px
                        - height: 76px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto 1fr
                        - align-items: center
                        - padding: 0 20px
                        - gap: 14px
                      icon:
                        - width: 22px
                        - opacity: '0.65'
                      name:
                        - font-size: 0.95rem
                        - font-weight: 300
                        - text-align: left

                  - type: custom:button-card
                    name: Dinner Time
                    icon: mdi:silverware-fork-knife
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      service_data:
                        entity_id: scene.dinner_time
                    styles:
                      card:
                        - border-radius: 28px
                        - height: 76px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto 1fr
                        - align-items: center
                        - padding: 0 20px
                        - gap: 14px
                      icon:
                        - width: 22px
                        - opacity: '0.65'
                      name:
                        - font-size: 0.95rem
                        - font-weight: 300
                        - text-align: left

                  - type: custom:button-card
                    name: Good Night
                    icon: mdi:weather-night
                    tap_action:
                      action: call-service
                      service: script.goodnight_routine
                    styles:
                      card:
                        - border-radius: 28px
                        - height: 76px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto 1fr
                        - align-items: center
                        - padding: 0 20px
                        - gap: 14px
                      icon:
                        - width: 22px
                        - opacity: '0.65'
                      name:
                        - font-size: 0.95rem
                        - font-weight: 300
                        - text-align: left

                  - type: custom:button-card
                    name: Leaving
                    icon: mdi:home-export-outline
                    tap_action:
                      action: call-service
                      service: script.leaving_home
                    styles:
                      card:
                        - border-radius: 28px
                        - height: 76px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto 1fr
                        - align-items: center
                        - padding: 0 20px
                        - gap: 14px
                      icon:
                        - width: 22px
                        - opacity: '0.65'
                      name:
                        - font-size: 0.95rem
                        - font-weight: 300
                        - text-align: left

              # ══════════════════════════════════════════════
              #  5 · CLIMATE — tap to open pop-up
              # ══════════════════════════════════════════════
              - type: custom:mushroom-climate-card
                entity: climate.thermostat
                name: Climate
                show_temperature_control: true
                hvac_modes:
                  - heat_cool
                  - heat
                  - cool
                  - "off"
                tap_action:
                  action: navigate
                  navigation_path: '#climate'
                card_mod:
                  style: |
                    ha-card {
                      font-family: var(--primary-font-family) !important;
                      border-radius: 28px;
                      box-shadow: none;
                      --ha-card-border-width: 0;
                      font-weight: 300;
                    }

              # ══════════════════════════════════════════════
              #  6 · NOW PLAYING — conditional, only when active
              # ══════════════════════════════════════════════
              - type: conditional
                conditions:
                  - condition: state
                    entity: media_player.living_room
                    state_not: unavailable
                  - condition: state
                    entity: media_player.living_room
                    state_not: idle
                card:
                  type: custom:mushroom-media-player-card
                  entity: media_player.living_room
                  name: Now Playing
                  use_media_info: true
                  show_volume_level: true
                  media_controls:
                    - play_pause_stop
                    - previous
                    - next
                  volume_controls:
                    - volume_slider
                    - volume_mute
                  card_mod:
                    style: |
                      ha-card {
                        font-family: var(--primary-font-family) !important;
                        border-radius: 28px;
                        box-shadow: none;
                        --ha-card-border-width: 0;
                        font-weight: 300;
                      }

              # ══════════════════════════════════════════════
              #  POP-UPS  (inline vertical-stacks)
              #  Frosted glass · slide-to-close
              # ══════════════════════════════════════════════

              # ── Living Room ────────────────────────────
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: '#living-room'
                    slide_to_close_distance: '200'
                    show_header: false
                    bg_opacity: '20'
                    bg_blur: '20'
                    entity: light.living_room_lights
                    use_accent_color: true
                    card_mod:
                      style: |
                        :host {
                          --mdc-dialog-scrim-color: rgba(0,0,0,0.2) !important;
                        }
                        .mdc-dialog .mdc-dialog__surface {
                          background: rgba(20,20,20,0.2) !important;
                          backdrop-filter: blur(16px) !important;
                          -webkit-backdrop-filter: blur(16px) !important;
                          box-shadow: none !important;
                        }
                        .bubble-name {
                          font-size: 24px !important;
                          font-weight: 300 !important;
                        }
                  - type: custom:layout-card
                    layout_type: custom:vertical-layout
                    cards:
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 40px; padding: 16px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_lights
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            show_color_control: false
                            show_color_temp_control: false
                            name: All Lights
                            card_mod:
                              style: |
                                ha-card {
                                  box-shadow: none;
                                  background: none;
                                  font-size: 1.3rem;
                                  font-weight: 300;
                                }
                          - type: custom:mushroom-chips-card
                            alignment: start
                            chips:
                              - type: template
                                content: Neutral
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    color_temp: 350
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-grey),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Warm
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    color_temp: 450
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-amber),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Orange
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    rgb_color: [255, 160, 0]
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-orange),0.2); }
                                    ha-icon { display: none; }
                            card_mod:
                              style: |
                                ha-card { padding: 0 10px 10px 10px; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 40px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_couch_lamp
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            name: Couch Lamp
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 40px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_tv_stand_lamp
