# ============================================================
#  Daily Driver  —  Control Center
#  Mobile-first · Apple-esque · 390px column
#
#  What's new vs. the existing dashboard:
#    • Single unified hero card  (time + greeting + date/temp)
#    • Status strip  (lock · lights · climate · presence chips)
#    • bubble-card horizontal-buttons-stack for room nav
#    • 4-pill scene row
#    • person cards via button-card custom_fields (no CSS hacks)
#    • Consistent 24px radius throughout
#
#  HACS required:
#    mushroom  ·  bubble-card  ·  button-card
#    lovelace-card-mod  ·  stack-in-card  ·  lovelace-layout-card
# ============================================================

title: Home
views:
  - title: Home
    path: home
    panel: true
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:layout-card
            layout_type: custom:vertical-layout
            layout:
              width: 390
              margin: auto
              padding: 12px 12px 80px   # bottom pad for iOS home bar
            cards:

              # ══════════════════════════════════════════════
              #  1 · HERO
              #     Left  : large clock
              #     Right : greeting (top) · date + temp (bottom)
              # ══════════════════════════════════════════════
              - type: custom:button-card
                show_icon: false
                show_name: false
                show_state: false
                custom_fields:
                  time: |
                    [[[
                      const d = new Date();
                      const h = d.getHours() % 12 || 12;
                      const m = d.getMinutes().toString().padStart(2, '0');
                      return `${h}:${m}`;
                    ]]]
                  greeting: |
                    [[[
                      const h = new Date().getHours();
                      if (h < 5)  return 'Good Night';
                      if (h < 12) return 'Good Morning';
                      if (h < 17) return 'Good Afternoon';
                      return 'Good Evening';
                    ]]]
                  detail: |
                    [[[
                      const d = new Date();
                      const days   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
                      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                      const raw = states['sensor.kdsm_temperature']?.state;
                      const temp = raw ? Math.round(parseFloat(raw)) + '°F' : '';
                      return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}` +
                             (temp ? `&nbsp;&middot;&nbsp;${temp} outside` : '');
                    ]]]
                styles:
                  card:
                    - padding: 28px 24px 22px
                    - border-radius: 24px
                    - box-shadow: none
                    - border-width: 0
                    - font-family: var(--primary-font-family)
                  grid:
                    - grid-template-areas: '"time greeting" "time detail"'
                    - grid-template-columns: auto 1fr
                    - grid-template-rows: auto auto
                    - column-gap: 20px
                    - row-gap: 4px
                    - align-items: center
                  custom_fields:
                    time:
                      - font-size: 4.2rem
                      - font-weight: 200
                      - line-height: 1
                      - letter-spacing: -3px
                      - align-self: center
                    greeting:
                      - font-size: 1.2rem
                      - font-weight: 300
                      - align-self: end
                    detail:
                      - font-size: 0.82rem
                      - font-weight: 300
                      - color: var(--secondary-text-color)
                      - align-self: start

              # ══════════════════════════════════════════════
              #  2 · STATUS STRIP
              #     Lock · Rooms on · Indoor temp · Who's home
              # ══════════════════════════════════════════════
              - type: custom:mushroom-chips-card
                chips:
                  # ── Lock ───────────────────────────────────
                  - type: template
                    icon: >
                      {{ 'mdi:lock' if is_state('lock.front_door','locked')
                         else 'mdi:lock-open-alert' }}
                    content: >
                      {{ 'Locked' if is_state('lock.front_door','locked')
                         else 'Unlocked' }}
                    tap_action:
                      action: toggle
                      entity: lock.front_door
                    card_mod:
                      style: |
                        :host {
                          {% if is_state('lock.front_door','locked') %}
                            --chip-background: rgba(var(--rgb-green),0.15) !important;
                            --color: var(--success-color) !important;
                          {% else %}
                            --chip-background: rgba(var(--rgb-red),0.15) !important;
                            --color: var(--error-color) !important;
                          {% endif %}
                        }

                  # ── Rooms on ───────────────────────────────
                  - type: template
                    icon: mdi:lightbulb-multiple-outline
                    content: >
                      {% set rooms = [
                        'light.living_room_lights',
                        'light.bedroom_lights',
                        'light.office_lights'
                      ] %}
                      {% set n = rooms | map('states') | select('eq','on') | list | count %}
                      {% if n == 0 %}All Off
                      {% else %}{{ n }} Room{{ 's' if n != 1 }}
                      {% endif %}
                    card_mod:
                      style: |
                        :host {
                          {% set rooms = ['light.living_room_lights','light.bedroom_lights','light.office_lights'] %}
                          {% if rooms | map('states') | select('eq','on') | list | count > 0 %}
                            --chip-background: rgba(var(--rgb-amber),0.15) !important;
                            --color: var(--warning-color) !important;
                          {% endif %}
                        }

                  # ── Indoor temp ────────────────────────────
                  - type: template
                    icon: >
                      {% set mode = states('climate.thermostat') %}
                      {% if mode == 'heat' %}mdi:fire
                      {% elif mode == 'cool' %}mdi:snowflake
                      {% else %}mdi:thermometer{% endif %}
                    content: >
                      {{ state_attr('climate.thermostat','current_temperature') | round(0) }}°
                    tap_action:
                      action: navigate
                      navigation_path: '#climate'

                  # ── Presence ───────────────────────────────
                  - type: template
                    icon: >
                      {{ 'mdi:home-account'
                         if is_state('person.jacob','home') or is_state('person.claire','home')
                         else 'mdi:home-outline' }}
                    content: >
                      {% set j = is_state('person.jacob','home') %}
                      {% set c = is_state('person.claire','home') %}
                      {% if j and c %}Both Home
                      {% elif j %}Jacob Home
                      {% elif c %}Claire Home
                      {% else %}Away{% endif %}

                card_mod:
                  style: |
                    ha-card {
                      --ha-card-border-width: 0;
                      --chip-border-width: 0;
                      --chip-box-shadow: none;
                      background: transparent;
                      box-shadow: none;
                      padding: 4px 0;
                      justify-content: flex-start;
                    }

              # ══════════════════════════════════════════════
              #  3 · ROOM NAVIGATION
              #     Horizontal buttons stack — tap to open pop-up
              #     Button color reflects light on/off state
              # ══════════════════════════════════════════════
              - type: custom:bubble-card
                card_type: horizontal-buttons-stack
                auto_order: false
                1_name: Living Room
                1_icon: mdi:sofa-outline
                1_link: '#living-room'
                1_entity: light.living_room_lights
                2_name: Bedroom
                2_icon: mdi:bed-king-outline
                2_link: '#bedroom'
                2_entity: light.bedroom_lights
                3_name: Office
                3_icon: mdi:desk
                3_link: '#office'
                3_entity: light.office_lights

              # ══════════════════════════════════════════════
              #  4 · CLIMATE STATUS
              #     Contextual icon + color · tap → #climate
              # ══════════════════════════════════════════════
              - type: custom:mushroom-template-card
                primary: >
                  {{ state_attr('climate.thermostat','current_temperature') | round(0) }}° inside
                secondary: >
                  {% set t = state_attr('climate.thermostat','temperature') %}
                  {% set mode = states('climate.thermostat') %}
                  Set {{ t }}° &nbsp;·&nbsp; {{ mode | replace('_',' ') | title }}
                icon: >
                  {% set mode = states('climate.thermostat') %}
                  {% if mode == 'heat' %}mdi:fire
                  {% elif mode == 'cool' %}mdi:snowflake
                  {% elif mode == 'heat_cool' %}mdi:sun-snowflake-variant
                  {% else %}mdi:thermostat-off{% endif %}
                icon_color: >
                  {% set mode = states('climate.thermostat') %}
                  {% if mode == 'heat' %}deep-orange
                  {% elif mode == 'cool' %}light-blue
                  {% elif mode == 'heat_cool' %}teal
                  {% else %}grey{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: '#climate'
                card_mod:
                  style: |
                    ha-card {
                      font-family: var(--primary-font-family) !important;
                      border-radius: 24px;
                      box-shadow: none;
                      --ha-card-border-width: 0;
                    }

              # ══════════════════════════════════════════════
              #  5 · SCENES  —  4 pill buttons
              #     Movie · Dinner · Night · Leaving
              # ══════════════════════════════════════════════
              - type: custom:layout-card
                layout_type: grid
                layout:
                  grid-template-columns: 1fr 1fr 1fr 1fr
                  gap: 8px
                  margin: 4px 0
                cards:
                  - type: custom:button-card
                    name: Movie
                    icon: mdi:television-play
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      service_data:
                        entity_id: scene.movie_time
                    styles: &scene_pill_style
                      card:
                        - border-radius: 100px
                        - height: 64px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i" "n"'
                        - grid-template-rows: auto auto
                        - justify-items: center
                        - align-items: center
                        - padding: 10px 4px 8px
                        - gap: 5px
                      icon:
                        - width: 20px
                        - opacity: '0.7'
                      name:
                        - font-size: 0.7rem
                        - font-weight: 300

                  - type: custom:button-card
                    name: Dinner
                    icon: mdi:silverware-fork-knife
                    tap_action:
                      action: call-service
                      service: scene.turn_on
                      service_data:
                        entity_id: scene.dinner_time
                    styles: *scene_pill_style

                  - type: custom:button-card
                    name: Night
                    icon: mdi:weather-night
                    tap_action:
                      action: call-service
                      service: script.goodnight_routine
                    styles: *scene_pill_style

                  - type: custom:button-card
                    name: Leaving
                    icon: mdi:home-export-outline
                    tap_action:
                      action: call-service
                      service: script.leaving_home
                    styles: *scene_pill_style

              # ══════════════════════════════════════════════
              #  6 · PEOPLE
              #     button-card + show_entity_picture + custom_fields
              #     No absolute positioning, no CSS pseudo-elements
              # ══════════════════════════════════════════════
              - type: custom:layout-card
                layout_type: grid
                layout:
                  grid-template-columns: 1fr 1fr
                  gap: 8px
                cards:
                  # ── Jacob ─────────────────────────────────
                  - type: custom:button-card
                    entity: person.jacob
                    show_name: false
                    show_state: false
                    show_entity_picture: true
                    custom_fields:
                      name_f: Jacob Colby
                      status: |
                        [[[
                          const s = entity.state;
                          if (s === 'home') return 'Home';
                          if (s === "Dick's Sporting Goods") return 'Work';
                          return 'Away';
                        ]]]
                      batt: |
                        [[[
                          const b = parseInt(states['sensor.jacob_phone_battery_level']?.state ?? '0');
                          if (isNaN(b)) return '';
                          const lvl = b > 90 ? '' : b > 80 ? '90' : b > 70 ? '80'
                                    : b > 60 ? '70' : b > 50 ? '60' : b > 40 ? '50'
                                    : b > 30 ? '40' : b > 20 ? '30' : b > 10 ? '20' : '10';
                          return `<ha-icon icon="mdi:battery${lvl ? '-'+lvl : ''}"
                                    style="--mdc-icon-size:13px;vertical-align:-2px"></ha-icon> ${b}%`;
                        ]]]
                    styles: &person_card_style
                      card:
                        - border-radius: 24px
                        - padding: 20px 16px
                        - box-shadow: none
                        - border-width: 0
                        - font-family: var(--primary-font-family)
                      grid:
                        - grid-template-areas: '"i name_f" "i status" "i batt"'
                        - grid-template-columns: 52px 1fr
                        - column-gap: 14px
                        - row-gap: 1px
                      img_cell:
                        - align-self: center
                        - justify-self: start
                        - width: 44px
                        - height: 44px
                        - border-radius: 50%
                        - overflow: hidden
                      entity_picture:
                        - width: 44px
                        - height: 44px
                        - border-radius: 50%
                      custom_fields:
                        name_f:
                          - font-size: 0.92rem
                          - font-weight: 400
                          - align-self: end
                          - padding-bottom: 1px
                        status:
                          - font-size: 0.78rem
                          - font-weight: 300
                          - color: var(--secondary-text-color)
                        batt:
                          - font-size: 0.72rem
                          - font-weight: 300
                          - color: var(--secondary-text-color)

                  # ── Claire ────────────────────────────────
                  - type: custom:button-card
                    entity: person.claire
                    show_name: false
                    show_state: false
                    show_entity_picture: true
                    custom_fields:
                      name_f: Claire Hill
                      status: |
                        [[[
                          const s = entity.state;
                          if (s === 'home') return 'Home';
                          if (s === 'Clive Behavioral Health') return 'Work';
                          return 'Away';
                        ]]]
                      batt: |
                        [[[
                          const b = parseInt(states['sensor.claire_phone_battery_level']?.state ?? '0');
                          if (isNaN(b)) return '';
                          const lvl = b > 90 ? '' : b > 80 ? '90' : b > 70 ? '80'
                                    : b > 60 ? '70' : b > 50 ? '60' : b > 40 ? '50'
                                    : b > 30 ? '40' : b > 20 ? '30' : b > 10 ? '20' : '10';
                          return `<ha-icon icon="mdi:battery${lvl ? '-'+lvl : ''}"
                                    style="--mdc-icon-size:13px;vertical-align:-2px"></ha-icon> ${b}%`;
                        ]]]
                    styles: *person_card_style

              # ══════════════════════════════════════════════
              #  7 · NOW PLAYING  (conditional — hidden when idle)
              # ══════════════════════════════════════════════
              - type: conditional
                conditions:
                  - condition: state
                    entity: media_player.living_room
                    state_not: unavailable
                  - condition: state
                    entity: media_player.living_room
                    state_not: idle
                  - condition: state
                    entity: media_player.living_room
                    state_not: "off"
                card:
                  type: custom:mushroom-media-player-card
                  entity: media_player.living_room
                  name: Now Playing
                  use_media_info: true
                  show_volume_level: true
                  media_controls:
                    - play_pause_stop
                    - previous
                    - next
                  volume_controls:
                    - volume_slider
                    - volume_mute
                  card_mod:
                    style: |
                      ha-card {
                        font-family: var(--primary-font-family) !important;
                        border-radius: 24px;
                        box-shadow: none;
                        --ha-card-border-width: 0;
                      }

              # ══════════════════════════════════════════════
              #  POP-UPS  (frosted glass · slide to close)
              #  Defined here as vertical-stacks so HA registers
              #  the bubble-card pop-up hashes correctly.
              # ══════════════════════════════════════════════

              # ── Living Room ───────────────────────────────
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: '#living-room'
                    slide_to_close_distance: '200'
                    show_header: false
                    bg_opacity: '20'
                    bg_blur: '20'
                    entity: light.living_room_lights
                    use_accent_color: true
                    card_mod:
                      style: &frosted_popup
                        |
                        :host { --mdc-dialog-scrim-color: rgba(0,0,0,0.25) !important; }
                        .mdc-dialog .mdc-dialog__surface {
                          background: rgba(20,20,20,0.2) !important;
                          backdrop-filter: blur(20px) saturate(120%) !important;
                          -webkit-backdrop-filter: blur(20px) saturate(120%) !important;
                          box-shadow: none !important;
                        }
                        .bubble-name { font-size: 24px !important; font-weight: 300 !important; }
                  - type: custom:layout-card
                    layout_type: custom:vertical-layout
                    cards:
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 16px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_lights
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            name: All Lights
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                          - type: custom:mushroom-chips-card
                            alignment: start
                            chips:
                              - type: template
                                content: Neutral
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    color_temp: 350
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-grey),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Warm
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    color_temp: 450
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-amber),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Orange
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.living_room_lights
                                  data:
                                    rgb_color: [255, 160, 0]
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-orange),0.2); }
                                    ha-icon { display: none; }
                            card_mod:
                              style: |
                                ha-card { padding: 0 10px 10px; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_couch_lamp
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            name: Couch Lamp
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_tv_stand_lamp
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            name: TV Stand Lamp
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.living_room_olivers_lamp
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            name: Oliver's Lamp
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-entity-card
                            entity: input_boolean.projector_power
                            name: Projector
                            tap_action:
                              action: perform-action
                              perform_action: script.projector_toggle
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }

              # ── Bedroom ───────────────────────────────────
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: '#bedroom'
                    slide_to_close_distance: '200'
                    show_header: false
                    bg_opacity: '20'
                    bg_blur: '20'
                    entity: light.bedroom_lights
                    use_accent_color: true
                    card_mod:
                      style: *frosted_popup
                  - type: custom:layout-card
                    layout_type: custom:vertical-layout
                    cards:
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 16px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.bedroom_lights
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            show_color_temp_control: true
                            name: All Lights
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                          - type: custom:mushroom-chips-card
                            alignment: start
                            chips:
                              - type: template
                                content: Neutral
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.bedroom_lights
                                  data:
                                    color_temp: 350
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-grey),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Warm
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.bedroom_lights
                                  data:
                                    color_temp: 450
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-amber),0.2); }
                                    ha-icon { display: none; }
                              - type: template
                                content: Sleep
                                tap_action:
                                  action: call-service
                                  service: light.turn_on
                                  target:
                                    entity_id: light.bedroom_lights
                                  data:
                                    color_temp: 500
                                    brightness_pct: 5
                                card_mod:
                                  style: |
                                    ha-card { --chip-background: rgba(var(--rgb-indigo),0.2); }
                                    ha-icon { display: none; }
                            card_mod:
                              style: |
                                ha-card { padding: 0 10px 10px; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.bedroom_tv_backlight
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            show_color_control: true
                            name: TV Backlight
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }
                      - type: custom:stack-in-card
                        card_mod:
                          style: |
                            ha-card { border-radius: 24px; padding: 12px; }
                        cards:
                          - type: custom:mushroom-light-card
                            entity: light.bedroom_leaf_lights
                            fill_container: true
                            show_brightness_control: true
                            use_light_color: true
                            show_color_control: true
                            name: Leaf Lights
                            card_mod:
                              style: |
                                ha-card { box-shadow: none; background: none; font-size: 1.3rem; font-weight: 300; }

              # ── Office ────────────────────────────────────
              - type: vertical-stack
                cards:
                  - type: custom:bubble-card
                    card_type: pop-up
                    hash: '#office'
                    slide_to_close_distance: '200'
                    show_header: false
                    bg_opacity: '20'
                    bg_blur: '20'
                    entity: light.office_lights
                    use_accent_color: true
                    card_mod:
                      style: *frosted_popup
                  - type: custom:layout-card
                    layout_type: custom:vertical-layout
                    cards:
                      - type: custom:stack-in-card
                        card_mod:
